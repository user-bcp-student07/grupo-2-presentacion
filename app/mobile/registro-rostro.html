<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billetera Digital · Registro: rostro</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="telefono">
  <div class="pantalla">
    <div class="isla"></div>
    <div class="barra-estado" aria-hidden="true">
      <span data-hora>9:41</span>
      <span class="iconos">
        <svg viewBox="0 0 24 24"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/><path d="M10 11v2"/><path d="M14 11v2"/></svg>
      </span>
    </div>

    <div class="app">
      <div class="topbar">
        <button class="icon-btn" type="button" data-ir="atras" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <h1>Registro</h1>
        <span class="chip">Paso 2 de 3</span>
      </div>
      <div class="pasos" aria-hidden="true"><i class="hecho"></i><i class="hecho"></i><i></i></div>

      <main class="main">
        <div>
          <h2 class="titulo">Escanea tu rostro</h2>
          <p class="subtitulo">Mira a la cámara y mantén tu rostro dentro del óvalo</p>
        </div>

        <div class="visor rostro" id="visor">
          <div class="marco">
            <svg class="ico-base" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
            <svg class="ico-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="barrido"></div>
          <div class="estado" id="estado">Listo para escanear</div>
        </div>

        <div class="acciones">
          <button class="btn" type="button" id="escanear">Escanear rostro</button>
          <button class="btn" type="button" id="continuar" data-ir="registro-validacion.html" hidden>Continuar</button>
        </div>
      </main>
    </div>

    <div class="loader on" role="status" aria-label="Cargando"><div class="spinner"></div></div>
    <div class="indicador-inicio" aria-hidden="true"></div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
  var visor = document.getElementById('visor');
  var estado = document.getElementById('estado');
  var escanear = document.getElementById('escanear');
  escanear.addEventListener('accion', function () {
    escanear.disabled = true;
    visor.classList.add('escaneando');
    estado.textContent = 'Escaneando…';
    setTimeout(function () {
      visor.classList.remove('escaneando');
      visor.classList.add('listo');
      estado.textContent = '¡Rostro capturado!';
      escanear.hidden = true;
      document.getElementById('continuar').hidden = false;
    }, 2000);
  });
</script>
</body>
</html>
