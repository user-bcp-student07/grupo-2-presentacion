<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billetera Digital · Ingresar</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="telefono">
  <div class="pantalla">
    <div class="isla"></div>
    <div class="barra-estado" aria-hidden="true">
      <span data-hora>9:41</span>
      <span class="iconos">
        <svg viewBox="0 0 24 24"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/><path d="M10 11v2"/><path d="M14 11v2"/></svg>
      </span>
    </div>

    <div class="app">
      <main class="main centro">
        <div class="centrado">
          <div class="marca" style="justify-content:center; margin-bottom:12px;">
            <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
          </div>
          <h1 class="titulo">Billetera Digital</h1>
          <p class="subtitulo">¡Qué bueno verte de nuevo! 👋</p>
        </div>

        <form class="card" data-ir="inicio.html" novalidate>
          <div class="campo">
            <label for="clave">Tu clave de 6 dígitos</label>
            <input id="clave" class="pin" name="clave" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required autocomplete="off">
          </div>
          <button class="btn" type="submit">Ingresar</button>
          <button class="btn secundario" type="button" data-ir="inicio.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
            Entrar con huella
          </button>
        </form>

        <a class="btn texto" href="registro-dni.html">¿Eres nuevo? Crea tu cuenta</a>
      </main>
    </div>

    <div class="loader on" role="status" aria-label="Cargando"><div class="spinner"></div></div>
    <div class="indicador-inicio" aria-hidden="true"></div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
  // Cada nuevo ingreso reinicia el contador de reintentos del caso de prueba "Luis Paredes"
  BD.set('intentosBanco', 0);
</script>
</body>
</html>
